{% extends "base.html" %}

{% block title %}Boardgame Log API - Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="card-title text-center mb-4">
                    <i class="bi bi-box-arrow-in-right"></i> Login
                </h2>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mb-3">
                        <i class="bi bi-check-circle"></i> Login
                    </button>
                </form>

                <div id="message" class="message"></div>

                <hr class="my-4">

                <p class="text-center mb-0">
                    No account yet? <a href="/register" class="text-decoration-none fw-bold">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', handleLogin)

    async function handleLogin(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const messageDiv = document.getElementById('message');

        try {
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            const response = await fetch('/auth/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                const userID = data.user_id;
                window.location.href = `/user/${userID}`;
            } else {
                messageDiv.textContent = data.detail || 'Login failed';
            }
        } catch (error) {
            messageDiv.textContent = 'An error occurred: ' + error.message;
        }
    }
</script>
{% endblock %}
